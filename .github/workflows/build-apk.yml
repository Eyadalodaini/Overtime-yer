name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Create missing default icon & prepare gradle
        run: |
          rm -f android/gradlew
          mkdir -p android/app/src/main/res/mipmap-hdpi
          if [ ! -f android/app/src/main/res/mipmap-hdpi/ic_launcher.png ]; then
            curl -o android/app/src/main/res/mipmap-hdpi/ic_launcher.png https://raw.githubusercontent.com/flutter/flutter/master/dev/integration_tests/flutter_gallery/android/app/src/main/res/mipmap-hdpi/ic_launcher.png
          fi
          echo "android.noVersionCheck=true" >> android/gradle.properties
          echo "android.newDsl=false" >> android/gradle.properties

      - name: Build Debug APK
        run: flutter build apk --debug --android-skip-build-dependency-validation

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: overtime-yer-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
